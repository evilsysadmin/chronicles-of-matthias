<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2230" />
    <title>Chronicles of Matthias</title>
    <link rel="preload" as="image" href="/chronicles-loading-art.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/chronicles-loading-crest.svg" type="image/svg+xml" />
    <!-- Visible immediately, before React and the game bundles are ready. -->
    <style>
      html,body { margin:0; min-height:100%; background:#080f18; }
      .chronicles-boot {
        position:fixed; inset:0; min-height:100vh; min-height:100dvh; isolation:isolate;
        display:grid; place-items:center; overflow:hidden; color:#e4c69a; text-align:center;
        background:radial-gradient(ellipse 60% 60% at 50% 38%,#20303f,transparent 75%),#080f18;
      }
      .chronicles-boot::before {
        content:'';position:absolute;inset:-6%;pointer-events:none;
        background:url('/chronicles-loading-art.svg') right center / cover no-repeat;
        filter:blur(30px) brightness(.75) saturate(1.15);opacity:.58;
        -webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 26%,#000 72%);
        mask-image:linear-gradient(90deg,transparent 0%,transparent 26%,#000 72%);
      }
      .chronicles-boot__art {
        position:absolute; inset:0; width:100%; height:100%;
        object-fit:cover; object-position:right center; opacity:.7; filter:blur(2px) brightness(.7);
        -webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent 26%,#000 72%);
        mask-image:linear-gradient(90deg,transparent 0%,transparent 26%,#000 72%);
      }
      .chronicles-boot__center { position:relative;z-index:1; width:min(90vw,460px);padding:24px 0; }
      .chronicles-boot__crest { display:block;width:108px;height:126px;margin:0 auto 14px;filter:drop-shadow(0 0 22px #c4996644); }
      .chronicles-boot__title { font:500 clamp(1.8rem,6vw,2.9rem)/1.2 Georgia,serif;letter-spacing:.16em;margin:0;text-shadow:0 2px 16px #000; }
      .chronicles-boot__label { font:400 1.1rem/1.5 Georgia,serif;margin:21px 0 18px; }
      .chronicles-boot__track { display:block;width:min(62vw,320px);height:3px;overflow:hidden;margin:auto;background:#ddba8d22; }
      .chronicles-boot__light { display:block;width:34%;height:100%;background:linear-gradient(90deg,transparent,#f5d59a,transparent);animation:chronicles-boot-sweep 2s ease-in-out infinite; }
      @keyframes chronicles-boot-sweep { from {transform:translateX(-100%)} to {transform:translateX(300%)} }
      @media(max-width:700px) { .chronicles-boot::before { background-position:84% center;-webkit-mask-image:none;mask-image:none; } .chronicles-boot__art { object-fit:cover;object-position:84% center;filter:blur(7px) brightness(.9) saturate(1.25);opacity:.44;-webkit-mask-image:none;mask-image:none; } }
      @media(prefers-reduced-motion:reduce) { .chronicles-boot__light {animation:none;transform:translateX(85%);} }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <div id="root">
      <main class="chronicles-boot" role="status" aria-live="polite" aria-label="Cargando Chronicles">
        <img class="chronicles-boot__art" src="/chronicles-loading-art.svg" alt="" aria-hidden="true" />
        <div class="chronicles-boot__center" aria-hidden="true">
          <img class="chronicles-boot__crest" src="/chronicles-loading-crest.svg" alt="" aria-hidden="true" />
          <h1 class="chronicles-boot__title">CHRONICLES</h1>
          <p class="chronicles-boot__label">Cargando Chronicles…</p>
          <span class="chronicles-boot__track"><span class="chronicles-boot__light"></span></span>
        </div>
      </main>
      <noscript>Chronicles necesita JavaScript para iniciar la aventura.</noscript>
    </div>
    <script type="module" src="/src/standalone/main.jsx"></script>
  </body>
</html>
