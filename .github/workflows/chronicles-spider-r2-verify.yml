name: Chronicles sewer spider R2 · public atlas gate
on:
  pull_request:
    paths:
      - frontend/src/chronicles/chroniclesRemoteSpiderSprite.js
      - frontend/src/chronicles/chroniclesSpriteBillboards.test.js
      - frontend/src/chroniclesEnemyVisualRegistry.js
      - frontend/src/chroniclesOfMatthiasThree.js
      - .github/workflows/chronicles-spider-r2-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-spider-asset:
    name: public-webp-integrity-and-cors
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify exact public R2 image, browser CORS, SHA and 8 cells
        shell: bash
        run: |
          set -euo pipefail
          url="https://assets.chronicles.shadowops.dpdns.org/sprites/sewer-spider-4e1324b3827c789a.webp"
          origin="https://staging.chronicles.shadowops.dpdns.org"
          curl --fail --location --silent --show-error --max-time 25 --retry 1 \
            --header "Origin: $origin" \
            --dump-header "$RUNNER_TEMP/spider.headers" \
            --output "$RUNNER_TEMP/spider.webp" "$url"
          python3 - "$RUNNER_TEMP/spider.webp" "$RUNNER_TEMP/spider.headers" "$origin" <<'PY'
          import hashlib, pathlib, sys
          image = pathlib.Path(sys.argv[1]).read_bytes()
          headers = pathlib.Path(sys.argv[2]).read_text()
          origin = sys.argv[3]
          header_blocks = [block for block in headers.replace("\r", "").split("\n\n") if block.strip()]
          last = header_blocks[-1].splitlines()
          fields = {}
          for line in last[1:]:
              if ":" in line:
                  key, value = line.split(":", 1)
                  fields[key.strip().lower()] = value.strip()
          assert last[0].split()[1] == "200", "Public object must respond HTTP 200"
          assert fields.get("content-type", "").split(";")[0].lower() == "image/webp", "Incorrect WebP MIME"
          assert fields.get("access-control-allow-origin") in (origin, "*"), "R2 CORS prevents Three.js from loading"
          assert image[:4] == b"RIFF" and image[8:16] == b"WEBPVP8X", "Expected extended WebP"
          width = 1 + int.from_bytes(image[24:27], "little")
          height = 1 + int.from_bytes(image[27:30], "little")
          assert (width, height) == (2560, 320), f"Unexpected atlas dimensions {width}x{height}"
          expected_sha = "4e1324b3827c789a20336f34e8f14d7aed62b0f1ca2f1a9e63eabc7643cda3be"
          actual_sha = hashlib.sha256(image).hexdigest()
          assert actual_sha == expected_sha, "R2 asset differs from the exact user-approved WebP"
          print(f"SEWER_SPIDER_R2_OK HTTP=200 MIME=image/webp CORS=OK SIZE={width}x{height} FRAMES=8 SHA256={actual_sha}")
          print(f"cache-control: {fields.get('cache-control', '(none)')}")
          PY
