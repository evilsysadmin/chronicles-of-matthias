name: Standalone Chronicles Go API
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o /tmp/chronicles-api ./cmd/chronicles-api
      - run: docker build -t chronicles-api:ci .
