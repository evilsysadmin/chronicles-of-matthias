name: Signal ShadowOps Chronicles staging after green source CI
on:
  workflow_run:
    # Every required exact-SHA check can finish last. Listening to all
    # three avoids waiting for hourly Infra polling when frontend CI is last.
    # The admission below still requires all three green and current main.
    workflows:
      - Chronicles CI
      - Chronicles frontend
      - Chronicles API
    types: [completed]
    branches: [main]

# workflow_run can access secrets: NEVER checkout the triggering commit,
# trust PR artifacts, accept fork runs, or run code from event payloads.
permissions:
  actions: read
  contents: read

concurrency:
  group: chronicles-infra-signal-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  signal:
    name: Verify source CI (not a deployment)
    outputs:
      ready: ${{ steps.admit.outputs.ready }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'evilsysadmin/chronicles-of-matthias'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Require current protected source main with three green workflows
        id: admit
        shell: bash
        run: |
          set -euo pipefail
          sha="$SOURCE_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 64
          printf '### Chronicles → ShadowOps staging handoff\n\nSource SHA: `%s`\n\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
          head="$(gh api repos/evilsysadmin/chronicles-of-matthias/commits/main --jq .sha)"
          # A malformed API response is not evidence that the source was
          # superseded. Fail closed so an operator can see the real problem.
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error title=Chronicles CD cannot verify main::GitHub returned an invalid protected-main SHA'
            echo 'CHRONICLES_SIGNAL_INVALID_MAIN_SHA' >&2
            exit 65
          }
          if [[ "$sha" != "$head" ]]; then
            echo "::notice title=Chronicles CD not dispatched (superseded)::The source commit was replaced by a newer main SHA."
            printf '**State: superseded.** Current main is `%s`. No Infra dispatch for this SHA.\n' "$head" >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs="$(gh api -X GET repos/evilsysadmin/chronicles-of-matthias/actions/runs \
            -f head_sha="$sha" -f event=push -f per_page=100)"
          # Distinguish genuine waiting-for-CI from an untrustworthy API
          # response. The REST query is limited to one page of 100 runs:
          # truncated, malformed or schema-invalid responses must fail closed.
          if ! jq -e '
            . as $p |
            ($p | type == "object") and
            ($p.total_count | type == "number") and
            ($p.total_count >= 0 and $p.total_count <= 100 and
              $p.total_count == ($p.workflow_runs | length)) and
            ($p.workflow_runs | type == "array") and
            ([$p.workflow_runs[]? |
              (. | type == "object") and
              (.id | type == "number") and
              (.workflow_id | type == "number") and
              (.head_sha | type == "string") and
              (.event | type == "string") and
              (.status | type == "string") and
              (.repository.full_name | type == "string") and
              (.conclusion == null or (.conclusion | type == "string"))
            ] | all)
          ' <<<"$runs" >/dev/null; then
            echo '::error title=Chronicles CD cannot verify source CI::Malformed or truncated workflow-run response'
            echo 'CHRONICLES_SIGNAL_INVALID_RUNS_PAYLOAD' >&2
            exit 66
          fi
          # Only complete successful push workflows of this exact SHA matter.
          # Infra independently revalidates all three with stronger identities.
          if ! jq -e --arg sha "$sha" '
            . as $payload |
            ($payload.total_count <= 100) and (
              [385763056,386812503,387132683] |
              all(.[]; . as $id |
                ([$payload.workflow_runs[]? | select(.workflow_id == $id and .head_sha == $sha and
                  .event == "push" and .head_branch == "main" and
                  .repository.full_name == "evilsysadmin/chronicles-of-matthias")] |
                  max_by(.id)) as $run |
                $run != null and $run.status == "completed" and $run.conclusion == "success"
              )
            )
          ' <<<"$runs" >/dev/null; then
            echo '::notice title=Chronicles CD waiting for source CI::All three checks must succeed for this exact main SHA before dispatch.'
            printf '**State: waiting for CI.** No Infra dispatch yet. The next source completion or hourly Infra reconciliation can retry.\n\n' >> "$GITHUB_STEP_SUMMARY"
            printf '| Required check | Latest status |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
            jq -r --arg sha "$sha" '
              . as $payload |
              [{id: 385763056, name: "Chronicles CI"},
               {id: 386812503, name: "Chronicles frontend"},
               {id: 387132683, name: "Chronicles API"}] | .[] | . as $check |
              ([$payload.workflow_runs[]? | select(.workflow_id == $check.id and .head_sha == $sha and
                .event == "push" and .head_branch == "main" and
                .repository.full_name == "evilsysadmin/chronicles-of-matthias")] | max_by(.id)) as $run |
              "| \($check.name) | \($run.conclusion // $run.status // "not started") |"
            ' <<<"$runs" >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo '**State: source CI green.** Eligible for dispatch; see the separate dispatch job for delivery result.' >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    name: Send staging API + Pages dispatch to Infra
    needs: signal
    if: needs.signal.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      INFRA_ACTIONS_TOKEN: ${{ secrets.SHADOWOPS_INFRA_ACTIONS_TOKEN }}
      SOURCE_READ_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Dispatch only the two dedicated staging CD workflows
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          printf '### Chronicles staging dispatch\n\nSource SHA: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$INFRA_ACTIONS_TOKEN" ]]; then
            echo '::error title=Chronicles CD dispatch not sent::SHADOWOPS_INFRA_ACTIONS_TOKEN is missing; hourly Infra polls remain active.'
            echo '**State: dispatch failed.** Token missing. Hourly Infra reconciliation remains available.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Source CI may have gone green before this dispatch job was queued,
          # while a newer protected-main commit arrived meanwhile. Check
          # freshness again immediately before spending the Infra token.
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          current="$(GH_TOKEN="$SOURCE_READ_TOKEN" gh api repos/evilsysadmin/chronicles-of-matthias/commits/main --jq .sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'CHRONICLES_DISPATCH_INVALID_MAIN_SHA' >&2
            exit 65
          }
          if [[ "$SOURCE_SHA" != "$current" ]]; then
            echo "::notice title=Chronicles staging dispatch superseded::Skipped obsolete $SOURCE_SHA; current main is $current"
            printf '**State: superseded before dispatch.** Current main is `%s`; no Infra workflow was requested.\n' "$current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A completed trusted dispatch already requested both workflows.
          # This SHA-scoped artifact is written only after BOTH dispatches
          # succeed; a partial failure remains retryable on the next signal.
          receipt_name="chronicles-infra-dispatch-$SOURCE_SHA"
          receipts="$(GH_TOKEN="$SOURCE_READ_TOKEN" gh api -X GET repos/evilsysadmin/chronicles-of-matthias/actions/artifacts -f name="$receipt_name" -f per_page=100)"
          # An incomplete artifact page cannot prove that no successful
          # dispatch receipt exists. Never duplicate staging requests based
          # on a truncated or malformed GitHub artifact response.
          if ! jq -e --arg name "$receipt_name" '
            . as $p |
            ($p | type == "object") and
            ($p.total_count | type == "number") and
            ($p.total_count >= 0 and $p.total_count <= 100) and
            ($p.artifacts | type == "array") and
            ($p.total_count == ($p.artifacts | length)) and
            ([$p.artifacts[]? |
              (. | type == "object") and
              (.name | type == "string") and
              # A response with an unrelated name is NOT proof of absence:
              # the server may have ignored the name filter or truncated
              # earlier results, concealing our prior successful receipt.
              (.name == $name) and
              (.expired | type == "boolean") and
              (.workflow_run.id | type == "number") and
              (.workflow_run.id > 0)
            ] | all)
          ' <<<"$receipts" >/dev/null; then
            echo 'CHRONICLES_DISPATCH_RECEIPT_INCONCLUSIVE' >&2
            exit 66
          fi
          prior_ids="$(jq -r --arg name "$receipt_name" '
            [.artifacts[] | select(.name == $name and .expired == false)
              | .workflow_run.id | select(type == "number" and . > 0)] | unique[]
          ' <<<"$receipts")" || {
            echo 'CHRONICLES_DISPATCH_RECEIPT_INCONCLUSIVE' >&2
            exit 66
          }
          while IFS= read -r prior_id; do
            [[ "$prior_id" =~ ^[0-9]+$ ]] || continue
            origin="$(GH_TOKEN="$SOURCE_READ_TOKEN" gh api "repos/evilsysadmin/chronicles-of-matthias/actions/runs/$prior_id")"
            # A malformed origin response is NOT evidence that the existing
            # receipt was untrusted. Without a trustworthy origin we cannot
            # conclude that another pair of staging dispatches is safe.
            if ! jq -e '
              (. | type == "object") and
              (.id | type == "number") and (.id > 0) and
              (.workflow_id | type == "number") and (.workflow_id > 0) and
              (.head_sha | type == "string") and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              (.path | type == "string") and
              (.event | type == "string") and
              (.head_branch | type == "string") and
              (.status | type == "string") and
              (.conclusion == null or (.conclusion | type == "string")) and
              (.repository.full_name | type == "string")
            ' <<<"$origin" >/dev/null; then
              echo 'CHRONICLES_DISPATCH_ORIGIN_INCONCLUSIVE' >&2
              exit 67
            fi
            # The receipt's name is not enough: prove it originated from
            # our exact workflow, for this exact source SHA. A receipt from
            # a different revision may not suppress a new staging dispatch.
            if jq -e --argjson id "$prior_id" --arg sha "$SOURCE_SHA" '
              .id == $id and .status == "completed" and .conclusion == "success"
              and .workflow_id == 389939241
              and .head_sha == $sha
              and .path == ".github/workflows/signal-shadowops-infra.yml"
              and .event == "workflow_run" and .head_branch == "main"
              and .repository.full_name == "evilsysadmin/chronicles-of-matthias"
            ' <<<"$origin" >/dev/null; then
              echo "CHRONICLES_DISPATCH_ALREADY_SENT sha=$SOURCE_SHA"
              printf '**State: previously dispatched.** Trusted completed handoff receipt for `%s`; no duplicate Infra request.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <<<"$prior_ids"
          # Never pass the token, SHA or environment from an untrusted payload.
          GH_TOKEN="$INFRA_ACTIONS_TOKEN" gh workflow run chronicles-api-staging.yml \
            --repo evilsysadmin/shadowops-infra --ref main \
            -f action=deploy -f environment=staging \
            -f source_sha="$SOURCE_SHA" -f only_if_new=true
          GH_TOKEN="$INFRA_ACTIONS_TOKEN" gh workflow run chronicles-pages-release.yml \
            --repo evilsysadmin/shadowops-infra --ref main \
            -f environment=staging -f source_sha="$SOURCE_SHA" -f only_if_new=true
          echo "::notice title=Chronicles staging dispatch sent::Requested API and Pages staging workflows in shadowops-infra for $SOURCE_SHA."
          printf '**State: dispatch sent.** Requested API and Pages staging for `%s`. This does not certify deployment; verify the downstream jobs and release receipt.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$SOURCE_SHA" > chronicles-dispatch-receipt.txt
          echo 'sent=true' >> "$GITHUB_OUTPUT"
      - name: Save successful staging dispatch receipt
        if: steps.dispatch.outputs.sent == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: chronicles-infra-dispatch-${{ github.event.workflow_run.head_sha }}
          path: chronicles-dispatch-receipt.txt
          retention-days: 30
          if-no-files-found: error
