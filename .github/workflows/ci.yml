name: Chronicles CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
# PR revisions share a group; each main push uses a unique run ID so it never queues behind an unrelated SHA.
concurrency:
  group: chronicles-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # IMPORTANT: DO NOT MERGE before required-status-check ruleset 25198769
  # explicitly requires frontend-vitest-build-chromium (in addition to
  # repository-contract and api-e2e). The independent frontend workflow owns
  # Chromium, so this job only verifies repository contracts.
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
      # Fail closed during the migration. Without a directly required
      # frontend check, this fast job could no longer protect browser E2E.
      - name: Verify frontend is directly required on protected main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/rulesets/25198769" \
            | node scripts/require-direct-frontend-ruleset.mjs
