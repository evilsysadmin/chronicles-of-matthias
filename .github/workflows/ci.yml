name: Chronicles CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
# PR revisions share a group; each main push uses a unique run ID so it never queues behind an unrelated SHA.
concurrency:
  group: chronicles-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Protect main's existing required check also protects the Chromium smoke:
  # GitHub ruleset 25198769 currently requires repository-contract and api-e2e,
  # but omits frontend "build". This required job must not turn green first.
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
      - name: Require real frontend Vitest, build and Chromium smoke for exact source SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          # Avoid duplicated Vite/Chromium work. Poll the actual Actions "build"
          # check from the independent frontend workflow for this immutable SHA.
          # A red, cancelled or missing browser job must NEVER yield a green
          # repository-contract, including during GitHub auto-merge evaluation.
          # The Actions runs listing may momentarily lose a previously seen
          # official run while GitHub finalizes it. A verified pending lookup
          # enables a bounded retry of that absence, never a green admission.
          observed_official_pending=false
          for attempt in $(seq 1 114); do
            result="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              -f check_name=build -f per_page=100 \
              --jq '[.check_runs[] | select(.name == "build" and .app.slug == "github-actions")] | if length == 0 then "pending" else (max_by(.id) | .status + ":" + (.conclusion // "")) end')"
            case "$result" in
              completed:success)
                # A green check named "build" alone is not sufficient: another
                # Actions workflow could use that name on the same commit.
                # Require the official frontend workflow ID, same SHA/event,
                # trusted repository and its latest completed green run.
                runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
                  -f head_sha="$HEAD_SHA" -f event="$GITHUB_EVENT_NAME" -f per_page=100)"
                identity_args=("$HEAD_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY")
                if [[ "$observed_official_pending" == true ]]; then
                  identity_args+=(--previously-observed-official)
                fi
                if node scripts/require-frontend-workflow.mjs "${identity_args[@]}" <<<"$runs"; then
                  echo "FRONTEND_BROWSER_REQUIRED_GREEN sha=$HEAD_SHA"
                  printf '\nFrontend Vitest/build/Chromium succeeded for `%s`.\n' "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                else
                  identity_rc=$?
                  # Retry the official pending state (75), and transient absence
                  # ONLY after the same official workflow was observed pending.
                  # An unseen, foreign, failed, cancelled, malformed or truncated
                  # workflow can never satisfy the exact-SHA identity gate.
                  if (( identity_rc != 75 )); then
                    exit "$identity_rc"
                  fi
                  observed_official_pending=true
                  if (( attempt % 12 == 1 )); then
                    echo "Awaiting official frontend workflow completion for $HEAD_SHA (poll $attempt/114)"
                  fi
                fi
                ;;
              completed:*)
                echo "::error title=Frontend browser check failed::Exact source SHA $HEAD_SHA has frontend check $result"
                exit 1
                ;;
              pending|queued:|in_progress:|requested:|waiting:)
                if (( attempt % 12 == 1 )); then
                  echo "Awaiting frontend build/Chromium for $HEAD_SHA ($result, poll $attempt/114)"
                fi
                ;;
              *)
                echo "::error title=Unexpected frontend check state::$result"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error title=Frontend browser check timed out::No successful build/Chromium for exact SHA $HEAD_SHA"
          exit 1
