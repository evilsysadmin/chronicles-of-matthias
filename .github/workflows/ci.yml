name: Chronicles CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
# PR revisions share a group; each main push uses a unique run ID so it never queues behind an unrelated SHA.
concurrency:
  group: chronicles-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Protect main's existing required check also protects the Chromium smoke:
  # GitHub ruleset 25198769 currently requires repository-contract and api-e2e,
  # but omits frontend "build". This required job must not turn green first.
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm test
      - name: Require real frontend Vitest, build and Chromium smoke for exact source SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 64
          # Avoid duplicated Vite/Chromium work. Poll the actual Actions "build"
          # check from the independent frontend workflow for this immutable SHA.
          # A red, cancelled or missing browser job must NEVER yield a green
          # repository-contract, including during GitHub auto-merge evaluation.
          for attempt in $(seq 1 114); do
            result="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              -f check_name=build -f per_page=100 \
              --jq '[.check_runs[] | select(.name == "build" and .app.slug == "github-actions")] | if length == 0 then "pending" else (max_by(.id) | .status + ":" + (.conclusion // "")) end')"
            case "$result" in
              completed:success)
                echo "FRONTEND_BROWSER_REQUIRED_GREEN sha=$HEAD_SHA"
                printf '\nFrontend Vitest/build/Chromium succeeded for `%s`.\n' "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              completed:*)
                echo "::error title=Frontend browser check failed::Exact source SHA $HEAD_SHA has frontend check $result"
                exit 1
                ;;
              pending|queued:|in_progress:|requested:|waiting:)
                if (( attempt % 12 == 1 )); then
                  echo "Awaiting frontend build/Chromium for $HEAD_SHA ($result, poll $attempt/114)"
                fi
                ;;
              *)
                echo "::error title=Unexpected frontend check state::$result"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error title=Frontend browser check timed out::No successful build/Chromium for exact SHA $HEAD_SHA"
          exit 1
