name: Standalone Chronicles web container
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-container.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-container.yml'
permissions:
  contents: read
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build independent web image
        run: docker build -t chronicles-web-smoke ./web
      - name: Start static frontend
        run: docker run -d --rm --name chronicles-web -p 127.0.0.1:18080:8080 chronicles-web-smoke
      - name: Verify response and staging marker
        run: |
          set -eu
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ -o /tmp/chronicles.html; then break; fi
            sleep 1
          done
          grep -q 'CHRONICLES OF MATTHIAS' /tmp/chronicles.html
          grep -q 'todavía no es el juego' /tmp/chronicles.html
          curl -fsS http://127.0.0.1:18080/style.css | grep -q 'color-scheme:dark'
      - name: Container logs
        if: always()
        run: docker logs chronicles-web || true
