name: Chronicles frontend (verbatim Chess Studio game)
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/vendor_chess_studio.py'
      - '.github/workflows/react-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/vendor_chess_studio.py'
      - '.github/workflows/react-frontend.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned Chess Studio commit
        id: lock
        run: echo "commit=$(python3 -c 'import json;print(json.load(open("frontend/VENDOR.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Chess Studio source
        uses: actions/checkout@v4
        with:
          repository: evilsysadmin/chess-studio
          ref: ${{ steps.lock.outputs.commit }}
          path: .chess-studio
          persist-credentials: false
      - name: Prove vendored game is byte-identical to Chess Studio
        run: python3 scripts/vendor_chess_studio.py check .chess-studio
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build against Chess Studio staging API
        working-directory: frontend
        env:
          VITE_API_URL: https://api-staging.chess-studio.shadowops.dpdns.org/api
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify the real game is in the bundle
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          ls frontend/dist/assets/ChroniclesOfMatthias-*.js
          ls frontend/dist/assets/ChroniclesOfMatthiasTactics-*.js
          ls frontend/dist/assets/chroniclesOfMatthiasThree-*.js
          grep -lF '/chronicles/runs' frontend/dist/assets/*.js
          grep -lF 'api-staging.chess-studio.shadowops.dpdns.org' frontend/dist/assets/*.js
      - name: Mount smoke — enter Chronicles and Tactics without crashing
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          until curl -fs -o /dev/null http://localhost:4173/; do sleep 0.5; done
          node smoke/mount.mjs http://localhost:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronicles-mount-smoke
          path: frontend/smoke-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: chronicles-frontend-dist
          path: frontend/dist
          retention-days: 7
