name: Chronicles frontend
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/react-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/react-frontend.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Game tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Build against the Chronicles staging API
        working-directory: frontend
        env:
          VITE_API_URL: https://chronicles-api-staging.shadowops.dpdns.org/api
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify the real game is in the bundle
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          ls frontend/dist/assets/ChroniclesOfMatthias-*.js
          ls frontend/dist/assets/ChroniclesOfMatthiasTactics-*.js
          ls frontend/dist/assets/chroniclesOfMatthiasThree-*.js
          grep -lF '/chronicles/runs' frontend/dist/assets/*.js
          grep -lF 'chronicles-api-staging.shadowops.dpdns.org' frontend/dist/assets/*.js
          test -s frontend/dist/audio/orchestra/violin-fs3.mp3
          test -s frontend/dist/models/matthias-home-canonical.glb
      - name: Mount smoke — enter Chronicles and Tactics without crashing
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          until curl -fs -o /dev/null http://localhost:4173/; do sleep 0.5; done
          node smoke/mount.mjs http://localhost:4173/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronicles-mount-smoke
          path: frontend/smoke-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: chronicles-frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-staging:
    name: Deploy Chronicles staging (Cloudflare Pages)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/chronicles-of-matthias'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: chronicles-pages-staging
      cancel-in-progress: false
    environment: chronicles-staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chronicles-frontend-dist
          path: dist
      - name: Require dedicated Chronicles Pages configuration
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ vars.CHRONICLES_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
          test -n "$API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$PROJECT" || { echo 'Missing CHRONICLES_PAGES_PROJECT variable'; exit 1; }
      - name: Publish tested build to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CHRONICLES_PAGES_PROJECT }} --branch=main
      - name: Verify dedicated staging URL responds
        env:
          STAGING_URL: https://staging.chronicles.shadowops.dpdns.org/
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 "$STAGING_URL" -o /tmp/chronicles-staging.html && grep -qi '<html' /tmp/chronicles-staging.html; then
              echo "Chronicles staging reachable: $STAGING_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Dedicated Chronicles staging URL failed its HTTP smoke check' >&2
          exit 1
