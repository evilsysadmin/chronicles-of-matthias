name: Chronicles frontend
on:
  # Every protected-main SHA must have a verifiable frontend CI result.
  # Infra admits an exact SHA only after frontend + API + repository CI pass.
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# PR revisions share one group; main pushes get a unique run ID and may run concurrently.
concurrency:
  group: chronicles-frontend-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      # TEMPORARY BOOTSTRAP: regenerate the genuine npm lockfile on a networked
      # GitHub runner; this step must be removed before the PR is merged.
      - name: Bootstrap exact Playwright lockfile (temporary)
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact playwright@1.64.1
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const f=require('node:fs');const b=f.readFileSync('package-lock.json').toString('base64');for(let i=0;i<b.length;i+=2800)console.log('CHRONICLES_LOCKCHUNK '+(i/2800)+' '+b.slice(i,i+2800));console.log('CHRONICLES_LOCKEND '+b.length)"
      - name: Game tests (Vitest)
        working-directory: frontend
        run: npm test
      - name: Build against the Chronicles staging API
        working-directory: frontend
        env:
          VITE_API_URL: https://chronicles-api-staging.shadowops.dpdns.org/api
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run build
          # Browser notice must compare the same immutable SHA as the bundle.
          test -s dist/release.json
          node -e "const m=require('./dist/release.json');if(m.build!==process.env.VITE_BUILD_SHA) process.exit(1)"
      - name: Verify the real game is in the bundle
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          ls frontend/dist/assets/ChroniclesOfMatthias-*.js
          ls frontend/dist/assets/ChroniclesOfMatthiasTactics-*.js
          ls frontend/dist/assets/chroniclesOfMatthiasThree-*.js
          grep -lF '/chronicles/runs' frontend/dist/assets/*.js
          grep -lF 'chronicles-api-staging.shadowops.dpdns.org' frontend/dist/assets/*.js
          test -s frontend/dist/audio/orchestra/violin-fs3.mp3
          test -s frontend/dist/models/matthias-home-canonical.glb
      # Avoid Chromium CDN/DNS fetches on every PR and main SHA.
      # The cache key is intentionally exact-versioned; never restore a different browser revision.
      - name: Restore pinned Playwright Chromium browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chronicles-playwright-${{ runner.os }}-${{ runner.arch }}-1.64.1
      - name: Mount smoke — enter Chronicles and Tactics without crashing
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
          source smoke/wait-for-http.sh
          # Include process liveness and logs in startup failure diagnostics.
          npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/chronicles-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "${preview_pid:-}" "${dev_pid:-}" 2>/dev/null || true' EXIT
          wait_for_http http://localhost:4173/ "$preview_pid" "$RUNNER_TEMP/chronicles-preview.log" "Vite preview"
          node smoke/mount.mjs http://localhost:4173/
          # Real menu components, independent of staging SSO or an account.
          npx vite --port 4174 --strictPort > "$RUNNER_TEMP/chronicles-dev.log" 2>&1 &
          dev_pid=$!
          wait_for_http http://localhost:4174/smoke/folio-mobile.html "$dev_pid" "$RUNNER_TEMP/chronicles-dev.log" "Vite smoke fixtures"
          node smoke/folio-mobile.mjs http://localhost:4174/smoke/folio-mobile.html
          # Real shop scene, filtering, comparing and trade on 360/390/430 + desktop.
          node smoke/shop-room.mjs http://localhost:4174/smoke/shop-room.html
          # Real expedition journal: truthful region hints, chapter navigation and mobile layout.
          node smoke/journal-book.mjs http://localhost:4174/smoke/journal-book.html
          # Screenshot the actual React/Suspense loader at desktop and mobile widths.
          node smoke/loader.mjs http://localhost:4174/smoke/loader.html
          # Real party editor: back/resume, F5 draft, commit and 360/390/430 + desktop.
          node smoke/character-setup.mjs http://localhost:4174/smoke/character-setup.html
          # Catalog outage: readable local saves, disabled mutation, truthful empty state.
          node smoke/save-menu.mjs http://localhost:4174/smoke/save-menu.html
          # First contact/payment: genuine road sightline and earned quest receipt, mobile + desktop.
          node smoke/first-hour-contact.mjs http://localhost:4174/smoke/first-hour-contact.html
          # Actual authored Swordhaven geometry: visual evidence of house-height streets
          # from reproducible fixed cameras, both mobile and desktop.
          node smoke/swordhaven-streets.mjs http://localhost:4174/smoke/swordhaven-streets.html
      # PR screenshots remain inspectable; failed main runs retain diagnostics.
      # Avoid repeatedly uploading already-compressed PNGs after healthy main pushes.
      - uses: actions/upload-artifact@v5
        if: ${{ always() && (github.event_name == 'pull_request' || failure()) }}
        with:
          name: chronicles-mount-smoke
          path: |
            frontend/smoke-*.png
          compression-level: 0
          retention-days: 7
      # Infra independently rebuilds pinned releases; this bundle is for PR inspection.
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'pull_request'
        with:
          name: chronicles-frontend-dist
          path: frontend/dist
          retention-days: 7

