name: Standalone Go container smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chronicles-api:smoke .
      - name: Run as non-root, healthcheck, and reject absent gameplay API
        run: |
          set -euo pipefail
          docker run -d --name chronicles-smoke --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18080:8080 chronicles-api:smoke
          trap 'docker rm -f chronicles-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/readyz)" = 503
          # The real plural routes must remain absent without staging opt-in.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/chronicles/runs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/chronicles/runs/fixture-run)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/chronicles/runs/fixture-run/bootstrap)" = 404
          test "$(docker exec chronicles-smoke /app/chronicles-api healthcheck; echo $?)" = 0
          if docker exec chronicles-smoke /app/chronicles-api readycheck >/dev/null 2>&1; then
            echo "ERROR: unconfigured container passed dependency readiness" >&2
            exit 1
          fi
          test "$(docker inspect chronicles-smoke --format '{{.Config.User}}')" = "65532:65532"
      - name: Refuse production read API opt-in before serving traffic
        run: |
          set -euo pipefail
          set +e
          timeout 8s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -e CHRONICLES_ENABLE_READ_API=true \
            -e CHRONICLES_ENVIRONMENT=production \
            chronicles-api:smoke > /tmp/chronicles-invalid-start.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "ERROR: invalid production read API config did not fail closed (exit $status)" >&2
            exit 1
          fi
