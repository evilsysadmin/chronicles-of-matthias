name: Chronicles API
on:
  # Unfiltered on purpose: its verify job is a required check on main, so it
  # must report on every PR (a path-filtered required check blocks merges).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Only superseded PR revisions are cancelled. Keep exact-SHA main API
# verification running even during rapid merges; staging admits only latest main.
concurrency:
  group: chronicles-api-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: api-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Build and vet (amd64 + arm64)
        working-directory: api
        run: |
          set -euo pipefail
          go vet ./cmd/...
          go test ./internal/chronicles/... ./internal/gamesapi/... ./internal/release/... ./cmd/...
          # Terra's maps are generated: the committed ones (game + API copy)
          # must be exactly what the table produces.
          go run ./cmd/terragen -check
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/chronicles-api" ./cmd/chronicles-api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/chronicles-api
      - name: Run the API against a real MongoDB
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          MONGO_DB_NAME: chronicles_ci
          JWT_SECRET: ci-only-jwt-secret-not-for-deploys
          INVITE_CODE: CIINVITE
          CORS_ORIGINS: http://localhost:4173
          ENVIRONMENT: ci
          PORT: '8090'
        run: |
          set -euo pipefail
          source frontend/smoke/wait-for-http.sh
          nohup "$RUNNER_TEMP/chronicles-api" > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          wait_for_http http://127.0.0.1:8090/api/health "$api_pid" "$RUNNER_TEMP/api.log" "Go API health"
          curl -fsS http://127.0.0.1:8090/api/health
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build the game against the local API
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8090/api
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      # Share the same pinned Chromium binary revision as frontend CI.
      - name: Restore pinned Playwright Chromium browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: chronicles-playwright-${{ runner.os }}-${{ runner.arch }}-1.64.1
      - name: Full-game E2E — register, new campaign, save, fresh login, resume
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
          source smoke/wait-for-http.sh
          npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/chronicles-api-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "${preview_pid:-}" 2>/dev/null || true' EXIT
          wait_for_http http://localhost:4173/ "$preview_pid" "$RUNNER_TEMP/chronicles-api-preview.log" "API E2E Vite preview"
          node smoke/api-e2e.mjs http://localhost:4173/ http://127.0.0.1:8090 CIINVITE
      - name: API log
        if: always()
        run: cat "$RUNNER_TEMP/api.log" || true
      # Keep PR review screenshots and failed-main evidence without archiving every green main build.
      - uses: actions/upload-artifact@v5
        if: ${{ always() && (github.event_name == 'pull_request' || failure()) }}
        with:
          name: chronicles-api-e2e
          path: frontend/api-e2e-*.png
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish SHA-pinned multi-arch image
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/chronicles-of-matthias'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/evilsysadmin/chronicles-api
    steps:
      # Older commits still complete their E2E verification, but should not
      # consume expensive multi-architecture publish work after main advances.
      # The API workflow remains green for a superseded SHA; source and Infra
      # admission independently require that SHA to still be current main.
      - name: Require current main SHA before Docker publication
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]] || exit 64
          if [[ "$GITHUB_SHA" != "$current" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=Skip obsolete API image::Source SHA $GITHUB_SHA superseded by main $current"
            echo "API image skipped: $GITHUB_SHA is no longer main ($current)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.admission.outputs.publish == 'true'
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        if: steps.admission.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.admission.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.admission.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/arm64 + linux/amd64
        if: steps.admission.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: api
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            CHRONICLES_SOURCE_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/evilsysadmin/chronicles-of-matthias
      - name: Attest build provenance
        if: steps.admission.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record digest
        if: steps.admission.outputs.publish == 'true'
        run: echo "IMAGE=${IMAGE}@${{ steps.push.outputs.digest }} (staging-${GITHUB_SHA})" | tee -a "$GITHUB_STEP_SUMMARY"
