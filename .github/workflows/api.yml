name: Chronicles API
on:
  # Unfiltered on purpose: its verify job is a required check on main, so it
  # must report on every PR (a path-filtered required check blocks merges).
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chronicles-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: api-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Build and vet (amd64 + arm64)
        working-directory: api
        run: |
          set -euo pipefail
          go vet ./cmd/...
          go test ./internal/chronicles/... ./cmd/terragen/...
          # Terra's maps are generated: the committed ones (game + API copy)
          # must be exactly what the table produces.
          go run ./cmd/terragen -check
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/chronicles-api" ./cmd/chronicles-api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/chronicles-api
      - name: Run the API against a real MongoDB
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          MONGO_DB_NAME: chronicles_ci
          JWT_SECRET: ci-only-jwt-secret-not-for-deploys
          INVITE_CODE: CIINVITE
          CORS_ORIGINS: http://localhost:4173
          ENVIRONMENT: ci
          PORT: '8090'
        run: |
          set -euo pipefail
          nohup "$RUNNER_TEMP/chronicles-api" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8090/api/health >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8090/api/health
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the game against the local API
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8090/api
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Full-game E2E — register, new campaign, save, fresh login, resume
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          until curl -fs -o /dev/null http://localhost:4173/; do sleep 0.5; done
          node smoke/api-e2e.mjs http://localhost:4173/ http://127.0.0.1:8090 CIINVITE
      - name: API log
        if: always()
        run: cat "$RUNNER_TEMP/api.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chronicles-api-e2e
          path: frontend/api-e2e-*.png
          retention-days: 7

  publish:
    name: Publish SHA-pinned multi-arch image
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/chronicles-of-matthias'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/evilsysadmin/chronicles-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/arm64 + linux/amd64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:staging-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/evilsysadmin/chronicles-of-matthias
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record digest
        run: echo "IMAGE=${IMAGE}@${{ steps.push.outputs.digest }} (staging-${GITHUB_SHA})" | tee -a "$GITHUB_STEP_SUMMARY"
